<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Product Engineer capability map</title>
  <desc id="desc">A capability map showing Product Engineer with skill map above four parallel core capabilities.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .root { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .core { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
      .user { fill: #e3f2fd; stroke: #1e88e5; stroke-width: 1.5; }
      .product { fill: #e8f5e9; stroke: #43a047; stroke-width: 1.5; }
      .tech { fill: #fff3e0; stroke: #fb8c00; stroke-width: 1.5; }
      .line { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .title { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Arial, sans-serif; fill: #1e293b; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="780"/>

  <ellipse class="root" cx="600" cy="60" rx="145" ry="42"/>
  <text class="title" x="600" y="66" text-anchor="middle">Product Engineer</text>

  <line class="line" x1="600" y1="102" x2="600" y2="132"/>
  <line class="line" x1="600" y1="464" x2="600" y2="506"/>

  <rect class="group" x="90" y="132" width="1020" height="332" rx="12"/>
  <rect class="core" x="490" y="156" width="220" height="48" rx="8"/>
  <text class="title" x="600" y="186" text-anchor="middle">Skill Map</text>

  <line class="line" x1="600" y1="204" x2="600" y2="232"/>
  <line class="line" x1="600" y1="232" x2="275" y2="232"/>
  <line class="line" x1="600" y1="232" x2="925" y2="232"/>
  <line class="line" x1="275" y1="232" x2="275" y2="256"/>
  <line class="line" x1="600" y1="232" x2="600" y2="256"/>
  <line class="line" x1="925" y1="232" x2="925" y2="256"/>

  <rect class="user" x="150" y="256" width="250" height="44" rx="8"/>
  <text class="label" x="275" y="284" text-anchor="middle">User Discovery</text>
  <rect class="product" x="475" y="256" width="250" height="44" rx="8"/>
  <text class="label" x="600" y="284" text-anchor="middle">Product Sense</text>
  <rect class="tech" x="800" y="256" width="250" height="44" rx="8"/>
  <text class="label" x="925" y="284" text-anchor="middle">Tech Stack</text>

  <line class="line" x1="275" y1="300" x2="275" y2="326"/>
  <line class="line" x1="600" y1="300" x2="600" y2="326"/>
  <line class="line" x1="925" y1="300" x2="925" y2="326"/>

  <rect class="user" x="165" y="326" width="220" height="34" rx="8"/>
  <text class="text" x="275" y="348" text-anchor="middle">User research</text>
  <rect class="user" x="165" y="374" width="220" height="34" rx="8"/>
  <text class="text" x="275" y="396" text-anchor="middle">Pain point analysis</text>
  <rect class="user" x="165" y="422" width="220" height="34" rx="8"/>
  <text class="text" x="275" y="444" text-anchor="middle">Feedback synthesis</text>

  <rect class="product" x="490" y="326" width="220" height="34" rx="8"/>
  <text class="text" x="600" y="348" text-anchor="middle">User value judgment</text>
  <rect class="product" x="490" y="374" width="220" height="34" rx="8"/>
  <text class="text" x="600" y="396" text-anchor="middle">Priority trade-offs</text>
  <rect class="product" x="490" y="422" width="220" height="34" rx="8"/>
  <text class="text" x="600" y="444" text-anchor="middle">Metrics thinking</text>

  <rect class="tech" x="815" y="326" width="220" height="34" rx="8"/>
  <text class="text" x="925" y="348" text-anchor="middle">Frontend</text>
  <rect class="tech" x="815" y="374" width="220" height="34" rx="8"/>
  <text class="text" x="925" y="396" text-anchor="middle">Backend</text>
  <rect class="tech" x="815" y="422" width="220" height="34" rx="8"/>
  <text class="text" x="925" y="444" text-anchor="middle">AI</text>

  <rect class="group" x="90" y="506" width="1020" height="210" rx="12"/>
  <rect class="core" x="480" y="530" width="240" height="48" rx="8"/>
  <text class="title" x="600" y="560" text-anchor="middle">Core Capabilities</text>

  <line class="line" x1="600" y1="578" x2="600" y2="608"/>
  <line class="line" x1="600" y1="608" x2="240" y2="608"/>
  <line class="line" x1="600" y1="608" x2="960" y2="608"/>
  <line class="line" x1="240" y1="608" x2="240" y2="636"/>
  <line class="line" x1="480" y1="608" x2="480" y2="636"/>
  <line class="line" x1="720" y1="608" x2="720" y2="636"/>
  <line class="line" x1="960" y1="608" x2="960" y2="636"/>

  <rect class="core" x="135" y="636" width="210" height="58" rx="8"/>
  <text class="text" x="240" y="661" text-anchor="middle">Problem discovery</text>
  <text class="text" x="240" y="680" text-anchor="middle">and definition</text>

  <rect class="core" x="375" y="636" width="210" height="58" rx="8"/>
  <text class="text" x="480" y="661" text-anchor="middle">Complex problem</text>
  <text class="text" x="480" y="680" text-anchor="middle">decomposition</text>

  <rect class="core" x="615" y="636" width="210" height="58" rx="8"/>
  <text class="text" x="720" y="670" text-anchor="middle">Solution design</text>

  <rect class="core" x="855" y="636" width="210" height="58" rx="8"/>
  <text class="text" x="960" y="661" text-anchor="middle">AI-assisted</text>
  <text class="text" x="960" y="680" text-anchor="middle">execution</text>
</svg>
