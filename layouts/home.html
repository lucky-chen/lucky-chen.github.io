{{ define "main" }}
<div class="markdown">
  <h1>{{ .Site.Title }}</h1>

  {{ with .Site.GetPage "/docs" }}
    {{ range .Sections.ByWeight }}
      <h2>{{ .Title }}</h2>
      <ul>
        {{ range .RegularPages.ByWeight }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </li>
        {{ end }}
      </ul>
    {{ end }}
  {{ end }}
</div>
{{ end }}
