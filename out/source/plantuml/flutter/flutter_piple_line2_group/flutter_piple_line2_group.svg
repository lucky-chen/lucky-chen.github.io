le="stroke:#181818;stroke-width:1.0;" x1="603.5" x2="645.5" y1="692.3887" y2="692.3887"/><line style="stroke:#181818;stroke-width:1.0;" x1="645.5" x2="645.5" y1="692.3887" y2="705.3887"/><line style="stroke:#181818;stroke-width:1.0;" x1="604.5" x2="645.5" y1="705.3887" y2="705.3887"/><polygon fill="#181818" points="614.5,701.3887,604.5,705.3887,614.5,709.3887,610.5,705.3887" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18" x="610.5" y="687.6465">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="632.5" y="687.6465">finalizeTree</text><!--MD5=[18c5a63e7e7cbed4c58b196e6a7b4bb9]
@startuml

autonumber

== Animate ==

Window->SchedulerBinding:handleBeginFrame
SchedulerBinding->FrameCallbackEntry:invoke

Window->Window:FlushMicrotasksNow


Window->SchedulerBinding:handleDrawFrame
SchedulerBinding->WidgetBinding:drawFrame

== Build ==

WidgetBinding->BuildOwner:buildScope




WidgetBinding->RendererBinding:drawFrame

== Layout ==

RenderBinding->PipelineOwner:flushLayout
RenderBinding->PipelineOwner:flushCompositingBits

== Paint ==

RenderBinding->PipelineOwner:flushPaint

== Layer ==

RenderBinding->RenderView:compositeFrame
RenderBinding->PipelineOwner:flushSemantics

== finalizeTree ==

BuildOwner->BuildOwner:finalizeTree




@enduml

